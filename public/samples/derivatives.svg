<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1330" viewBox="0 0 1000 1330">
<defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e8ede9" stroke-width=".8"/></pattern></defs>
<rect width="1000" height="1330" fill="#fffefa"/><rect x="0" y="0" width="1000" height="1330" fill="url(#grid)"/>
<path d="M100 0V1330" stroke="#efddd4" stroke-width="1.3"/>
<g font-family="Georgia,serif" fill="#445a59">
<text x="148" y="90" font-family="Arial,sans-serif" font-size="14" letter-spacing="4" fill="#9aa594">CALCULUS I  /  STUDY NOTE 03</text>
<text x="145" y="165" font-size="49" font-style="italic">Derivatives, made simple.</text>
<path d="M147 185Q413 199 738 184" stroke="#b1c49a" stroke-width="9" opacity=".6" fill="none"/>
<text x="148" y="246" font-size="23" fill="#899883" font-style="italic">How does a function change at a single point?</text>
<text x="148" y="330" font-size="29" font-style="italic">01. The power rule</text>
<rect x="143" y="358" width="688" height="112" rx="7" fill="#edf2e5" opacity=".88"/>
<text x="184" y="430" font-size="38" font-style="italic">d/dx [ xⁿ ] = n · xⁿ⁻¹</text>
<text x="153" y="517" font-size="23" font-style="italic">Bring the exponent down, then subtract one.</text>
<text x="153" y="560" font-size="24" font-style="italic" fill="#819175">e.g.  f(x) = x³  →  f′(x) = 3x²</text>
<text x="148" y="658" font-size="29" font-style="italic">02. A function inside a function</text>
<text x="153" y="708" font-size="24" font-style="italic">The chain rule: outside′ × inside′</text>
<rect x="143" y="744" width="688" height="114" rx="7" fill="#f4eddf" opacity=".9"/>
<text x="184" y="816" font-size="36" font-style="italic">f(x) = (3x² + 1)⁴</text>
<path d="M677 845Q727 901 703 955" stroke="#aa9273" stroke-width="2" fill="none"/><path d="m694 946 9 9 10-8" stroke="#aa9273" stroke-width="2" fill="none"/>
<text x="153" y="922" font-size="25" font-style="italic">Let u = 3x² + 1</text>
<text x="153" y="976" font-size="25" font-style="italic">Then f′(x) = 4u³ · u′</text>
<text x="653" y="996" font-size="21" font-style="italic" fill="#ad987b">inside first!</text>
<path d="M151 1020H818" stroke="#c5d0bc" stroke-dasharray="5 7"/>
<text x="153" y="1083" font-size="25" font-style="italic">Your turn: finish the derivative.</text>
<text x="153" y="1138" font-size="23" font-style="italic" fill="#93a08a">What happens to the inner function?</text>
<text x="148" y="1248" font-family="Arial,sans-serif" font-size="12" letter-spacing="2" fill="#adb6a3">NOTEPILOT ORIGINAL · SYNTHETIC STUDY NOTES · CC0</text>
</g></svg>